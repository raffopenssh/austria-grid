<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Primary Meta Tags -->
    <title>{{ title }}</title>
    <meta name="title" content="{{ title }}">
    <meta name="description" content="{{ description }}">
    <meta name="keywords" content="{{ keywords }}">
    <meta name="author" content="Austria Wind Grid">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="{{ canonical_url }}">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ canonical_url }}">
    <meta property="og:title" content="{{ title }}">
    <meta property="og:description" content="{{ description }}">
    <meta property="og:image" content="{{ og_image }}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="de_AT">
    <meta property="og:site_name" content="Windkraft Österreich - Netzkapazität">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="{{ canonical_url }}">
    <meta property="twitter:title" content="{{ title }}">
    <meta property="twitter:description" content="{{ description }}">
    <meta property="twitter:image" content="{{ og_image }}">
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {{ structured_data | safe }}
    </script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        h1 {
            color: #00d4aa;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }
        h2 {
            color: #00d4aa;
            font-size: 1.5rem;
            margin: 30px 0 15px;
        }
        p { margin-bottom: 15px; }
        a { color: #4a9eff; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .breadcrumb {
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #888;
        }
        .breadcrumb a { color: #888; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        .stat-card {
            background: rgba(0,0,0,0.3);
            border: 1px solid #333;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }
        .stat-value {
            font-size: 2rem;
            color: #00d4aa;
            font-weight: bold;
        }
        .stat-label {
            color: #888;
            font-size: 0.9rem;
        }
        .cta-button {
            display: inline-block;
            background: linear-gradient(135deg, #00d4aa, #00a88a);
            color: #000;
            padding: 15px 30px;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            margin: 20px 0;
        }
        .cta-button:hover {
            text-decoration: none;
            opacity: 0.9;
        }
        .map-preview {
            width: 100%;
            height: 400px;
            border: 2px solid #00d4aa;
            border-radius: 10px;
            margin: 20px 0;
        }
        .list-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 10px;
            margin: 20px 0;
        }
        .list-item {
            background: rgba(0,0,0,0.2);
            padding: 10px 15px;
            border-radius: 5px;
            border-left: 3px solid #00d4aa;
        }
        footer {
            margin-top: 60px;
            padding-top: 30px;
            border-top: 1px solid #333;
            color: #666;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="container">
        {{ content | safe }}
        
        <footer>
            <p>© 2025 Windkraft Österreich Netzkapazität · 
               <a href="/quellen">Quellen & Methodik</a> · 
               <a href="/sitemap.xml">Sitemap</a>
            </p>
            <p>Daten: IG Windkraft, E-Control Austria, APG, data.gv.at</p>
        </footer>
    </div>
</body>
</html>
